<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆卡片 - 知识复习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .stat-item .number {
            font-size: 2rem;
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-tab.active {
            background: #fff;
            color: #667eea;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .deck-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .deck-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .deck-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .deck-card .card-count {
            color: #666;
            font-size: 0.9rem;
        }

        .deck-card .deck-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .deck-card .deck-actions button {
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .deck-card .deck-actions button:hover {
            background: white;
        }

        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        .card-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .card-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-item-content {
            flex: 1;
        }

        .card-item-content .question {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .card-item-content .answer {
            color: #666;
            font-size: 0.9rem;
        }

        .card-item-actions {
            display: flex;
            gap: 5px;
        }

        .card-item-actions button {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .review-container {
            text-align: center;
        }

        .review-card {
            background: #f5f7fa;
            border-radius: 15px;
            padding: 40px;
            margin: 20px 0;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .review-card .question-text {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .review-card .answer-text {
            font-size: 1.3rem;
            color: #667eea;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .review-card .answer-text.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        .review-card .cloze-text {
            font-size: 1.3rem;
            color: #667eea;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .review-card .cloze-text.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .review-progress {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .mastery-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .mastery-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .mastery-btn.again {
            background: #dc3545;
            color: white;
        }

        .mastery-btn.hard {
            background: #ffc107;
            color: #333;
        }

        .mastery-btn.good {
            background: #28a745;
            color: white;
        }

        .mastery-btn.easy {
            background: #17a2b8;
            color: white;
        }

        .mastery-btn:hover {
            transform: scale(1.05);
        }

        .review-mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 30px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            color: #667eea;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
        }

        .mode-btn.selected {
            background: #667eea;
            color: white;
        }

        .cloze-difficulty {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .cloze-difficulty label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        .batch-input {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .batch-help {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 记忆卡片</h1>
            <p>知识复习系统</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="number" id="totalDecks">0</div>
                <div>知识库</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalCards">0</div>
                <div>总卡片</div>
            </div>
            <div class="stat-item">
                <div class="number" id="masteredCards">0</div>
                <div>已掌握</div>
            </div>
            <div class="stat-item">
                <div class="number" id="learningCards">0</div>
                <div>学习中</div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="decks">知识库</button>
            <button class="nav-tab" data-tab="review">开始复习</button>
            <button class="nav-tab" data-tab="stats">学习统计</button>
        </div>

        <div id="decksView">
            <div class="card">
                <h2>📚 我的知识库</h2>
                <button class="btn" onclick="showCreateDeckModal()">+ 新建知识库</button>
            </div>
            <div class="deck-grid" id="deckList"></div>
        </div>

        <div id="reviewView" class="hidden">
            <div class="card">
                <h2>🎯 选择复习模式</h2>
                <div class="review-mode-selector">
                    <button class="mode-btn selected" data-mode="moshi" onclick="selectReviewMode('moshi')">📝 默写模式</button>
                    <button class="mode-btn" data-mode="cloze" onclick="selectReviewMode('cloze')"> blanks 填空模式</button>
                </div>
                <div id="clozeOptions" class="hidden">
                    <div class="cloze-difficulty">
                        <label>
                            <input type="radio" name="clozeDifficulty" value="30" checked> 简单 (30%)
                        </label>
                        <label>
                            <input type="radio" name="clozeDifficulty" value="50"> 中等 (50%)
                        </label>
                        <label>
                            <input type="radio" name="clozeDifficulty" value="70"> 困难 (70%)
                        </label>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>📖 选择知识库</h2>
                <div class="deck-grid" id="reviewDeckList"></div>
            </div>
        </div>

        <div id="reviewGameView" class="hidden">
            <div class="card review-container">
                <div class="review-progress">
                    <span id="currentIndex">1</span> / <span id="totalReview">0</span>
                </div>
                <div class="review-card">
                    <div class="question-text" id="reviewQuestion"></div>
                    <div class="answer-text" id="reviewAnswer"></div>
                    <div class="cloze-text" id="reviewCloze"></div>
                </div>
                <div class="review-controls">
                    <button class="btn" id="showAnswerBtn" onclick="showAnswer()">显示答案</button>
                    <button class="btn btn-secondary" onclick="exitReview()">退出复习</button>
                </div>
                <div class="mastery-btns hidden" id="masteryBtns">
                    <button class="mastery-btn again" onclick="rateMastery(0)">陌生</button>
                    <button class="mastery-btn hard" onclick="rateMastery(1)">困难</button>
                    <button class="mastery-btn good" onclick="rateMastery(2)">熟悉</button>
                    <button class="mastery-btn easy" onclick="rateMastery(3)">掌握</button>
                </div>
            </div>
        </div>

        <div id="statsView" class="hidden">
            <div class="card">
                <h2>📊 学习统计</h2>
                <div id="statsContent"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="deckModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="deckModalTitle">新建知识库</h3>
                <button class="modal-close" onclick="closeModal('deckModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>名称</label>
                <input type="text" id="deckName" placeholder="输入知识库名称">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="deckDescription" placeholder="输入知识库描述（可选）"></textarea>
            </div>
            <button class="btn" onclick="saveDeck()">保存</button>
        </div>
    </div>

    <div class="modal" id="cardsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="cardsModalTitle">管理卡片</h3>
                <button class="modal-close" onclick="closeModal('cardsModal')">&times;</button>
            </div>
            <div style="margin-bottom: 20px;">
                <button class="btn" onclick="showAddCardForm()">+ 添加单张卡片</button>
                <button class="btn btn-secondary" onclick="showBatchAddForm()">+ 批量导入</button>
            </div>
            <div id="addCardForm" class="hidden">
                <div class="form-group">
                    <label>问题</label>
                    <input type="text" id="cardQuestion" placeholder="输入问题">
                </div>
                <div class="form-group">
                    <label>答案</label>
                    <textarea id="cardAnswer" placeholder="输入答案"></textarea>
                </div>
                <button class="btn" onclick="saveCard()">添加卡片</button>
            </div>
            <div id="batchAddForm" class="hidden">
                <div class="batch-help">
                    格式说明：每行一张卡片，问题和答案用 <b>::</b> 分隔<br>
                    例如：<br>
                    中国的首都是什么？::北京<br>
                    2 + 2 等于多少？::4
                </div>
                <textarea class="batch-input" id="batchCardsInput" placeholder="请输入卡片，每行一张，问题和答案用 :: 分隔"></textarea>
                <button class="btn" onclick="saveBatchCards()" style="margin-top: 10px;">批量导入</button>
            </div>
            <div class="card-list" id="cardList"></div>
        </div>
    </div>

    <div class="modal" id="editCardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑卡片</h3>
                <button class="modal-close" onclick="closeModal('editCardModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>问题</label>
                <input type="text" id="editCardQuestion">
            </div>
            <div class="form-group">
                <label>答案</label>
                <textarea id="editCardAnswer"></textarea>
            </div>
            <input type="hidden" id="editCardId">
            <button class="btn" onclick="updateCard()">保存修改</button>
        </div>
    </div>

    <script>
        let currentDeckId = null;
        let reviewCards = [];
        let currentCardIndex = 0;
        let currentReviewMode = 'moshi';
        let isAnswerShown = false;

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const tabName = tab.dataset.tab;
                document.getElementById('decksView').classList.add('hidden');
                document.getElementById('reviewView').classList.add('hidden');
                document.getElementById('reviewGameView').classList.add('hidden');
                document.getElementById('statsView').classList.add('hidden');
                
                if (tabName === 'decks') {
                    document.getElementById('decksView').classList.remove('hidden');
                    loadDecks();
                } else if (tabName === 'review') {
                    document.getElementById('reviewView').classList.remove('hidden');
                    loadReviewDecks();
                } else if (tabName === 'stats') {
                    document.getElementById('statsView').classList.remove('hidden');
                    loadStats();
                }
            });
        });

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                
                document.getElementById('totalDecks').textContent = stats.total_decks;
                document.getElementById('totalCards').textContent = stats.total_cards;
                document.getElementById('masteredCards').textContent = stats.mastered_cards;
                document.getElementById('learningCards').textContent = stats.learning_cards;

                const masteryPercent = stats.total_cards > 0 ? Math.round((stats.mastered_cards / stats.total_cards) * 100) : 0;
                const learningPercent = stats.total_cards > 0 ? Math.round((stats.learning_cards / stats.total_cards) * 100) : 0;

                document.getElementById('statsContent').innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 2rem; font-weight: bold; color: #667eea;">${masteryPercent}%</div>
                            <div>掌握率</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 2rem; font-weight: bold; color: #28a745;">${stats.mastered_cards}</div>
                            <div>已掌握</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 2rem; font-weight: bold; color: #ffc107;">${stats.familiar_cards}</div>
                            <div>熟悉</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 2rem; font-weight: bold; color: #dc3545;">${stats.learning_cards}</div>
                            <div>学习中</div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        async function loadDecks() {
            try {
                const res = await fetch('/api/decks');
                const decks = await res.json();
                
                const deckList = document.getElementById('deckList');
                if (decks.length === 0) {
                    deckList.innerHTML = `
                        <div class="empty-state">
                            <h3>暂无知识库</h3>
                            <p>点击"新建知识库"开始创建</p>
                        </div>
                    `;
                    return;
                }
                
                deckList.innerHTML = decks.map(deck => `
                    <div class="deck-card" onclick="openDeck(${deck.id}, '${deck.name}')">
                        <div class="deck-actions">
                            <button onclick="event.stopPropagation(); editDeck(${deck.id}, '${deck.name}', '${deck.description || ''}')">编辑</button>
                            <button onclick="event.stopPropagation(); deleteDeck(${deck.id})">删除</button>
                        </div>
                        <h3>${deck.name}</h3>
                        <p class="card-count">${deck.card_count} 张卡片</p>
                        ${deck.description ? `<p style="color: #888; font-size: 0.85rem; margin-top: 5px;">${deck.description}</p>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load decks:', err);
            }
        }

        async function loadReviewDecks() {
            try {
                const res = await fetch('/api/decks');
                const decks = await res.json();
                
                const deckList = document.getElementById('reviewDeckList');
                if (decks.length === 0 || decks.every(d => d.card_count === 0)) {
                    deckList.innerHTML = `
                        <div class="empty-state">
                            <h3>暂无可复习的知识库</h3>
                            <p>请先创建知识库并添加卡片</p>
                        </div>
                    `;
                    return;
                }
                
                deckList.innerHTML = decks.filter(d => d.card_count > 0).map(deck => `
                    <div class="deck-card" onclick="startReview(${deck.id})">
                        <h3>${deck.name}</h3>
                        <p class="card-count">${deck.card_count} 张卡片</p>
                        <button class="btn" style="margin-top: 15px; width: 100%;">开始复习</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load review decks:', err);
            }
        }

        function showCreateDeckModal() {
            document.getElementById('deckModalTitle').textContent = '新建知识库';
            document.getElementById('deckName').value = '';
            document.getElementById('deckDescription').value = '';
            document.getElementById('deckModal').classList.add('active');
        }

        function editDeck(id, name, description) {
            document.getElementById('deckModalTitle').textContent = '编辑知识库';
            document.getElementById('deckName').value = name;
            document.getElementById('deckDescription').value = description;
            document.getElementById('deckModal').dataset.editId = id;
            document.getElementById('deckModal').classList.add('active');
        }

        async function saveDeck() {
            const name = document.getElementById('deckName').value.trim();
            const description = document.getElementById('deckDescription').value.trim();
            
            if (!name) {
                alert('请输入知识库名称');
                return;
            }

            const editId = document.getElementById('deckModal').dataset.editId;
            
            try {
                if (editId) {
                    await fetch(`/api/decks/${editId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, description })
                    });
                    delete document.getElementById('deckModal').dataset.editId;
                } else {
                    await fetch('/api/decks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, description })
                    });
                }
                
                closeModal('deckModal');
                loadDecks();
                loadStats();
            } catch (err) {
                console.error('Failed to save deck:', err);
                alert('保存失败');
            }
        }

        async function deleteDeck(id) {
            if (!confirm('确定要删除这个知识库吗？所有卡片将被删除。')) return;
            
            try {
                await fetch(`/api/decks/${id}`, { method: 'DELETE' });
                loadDecks();
                loadStats();
            } catch (err) {
                console.error('Failed to delete deck:', err);
                alert('删除失败');
            }
        }

        async function openDeck(id, name) {
            currentDeckId = id;
            document.getElementById('cardsModalTitle').textContent = name + ' - 管理卡片';
            document.getElementById('cardsModal').classList.add('active');
            loadCards(id);
        }

        async function loadCards(deckId) {
            try {
                const res = await fetch(`/api/decks/${deckId}/cards`);
                const cards = await res.json();
                
                const cardList = document.getElementById('cardList');
                if (cards.length === 0) {
                    cardList.innerHTML = '<div class="empty-state"><p>暂无卡片，点击上方按钮添加</p></div>';
                    return;
                }
                
                const masteryLabels = ['陌生', '困难', '熟悉', '掌握'];
                const masteryColors = ['#dc3545', '#ffc107', '#28a745', '#17a2b8'];
                
                cardList.innerHTML = cards.map(card => `
                    <div class="card-item">
                        <div class="card-item-content">
                            <div class="question">${card.question}</div>
                            <div class="answer">${card.answer}</div>
                            <div style="margin-top: 5px; font-size: 0.8rem; color: ${masteryColors[card.mastery_level]};">
                                掌握程度: ${masteryLabels[card.mastery_level]} | 复习次数: ${card.review_count}
                            </div>
                        </div>
                        <div class="card-item-actions">
                            <button class="btn btn-warning" onclick="editCard(${card.id}, '${escapeHtml(card.question)}', '${escapeHtml(card.answer)}')">编辑</button>
                            <button class="btn btn-danger" onclick="deleteCard(${card.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load cards:', err);
            }
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function showAddCardForm() {
            document.getElementById('addCardForm').classList.remove('hidden');
            document.getElementById('batchAddForm').classList.add('hidden');
            document.getElementById('cardQuestion').value = '';
            document.getElementById('cardAnswer').value = '';
        }

        function showBatchAddForm() {
            document.getElementById('addCardForm').classList.add('hidden');
            document.getElementById('batchAddForm').classList.remove('hidden');
            document.getElementById('batchCardsInput').value = '';
        }

        async function saveCard() {
            const question = document.getElementById('cardQuestion').value.trim();
            const answer = document.getElementById('cardAnswer').value.trim();
            
            if (!question || !answer) {
                alert('请输入问题和答案');
                return;
            }

            try {
                await fetch(`/api/decks/${currentDeckId}/cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, answer })
                });
                
                document.getElementById('cardQuestion').value = '';
                document.getElementById('cardAnswer').value = '';
                loadCards(currentDeckId);
                loadDecks();
                loadStats();
            } catch (err) {
                console.error('Failed to save card:', err);
                alert('保存失败');
            }
        }

        async function saveBatchCards() {
            const input = document.getElementById('batchCardsInput').value.trim();
            if (!input) {
                alert('请输入卡片内容');
                return;
            }

            const lines = input.split('\n');
            const cards = [];
            
            for (const line of lines) {
                const parts = line.split('::');
                if (parts.length >= 2) {
                    cards.push({
                        question: parts[0].trim(),
                        answer: parts.slice(1).join('::').trim()
                    });
                }
            }

            if (cards.length === 0) {
                alert('未能解析出有效的卡片，请检查格式');
                return;
            }

            try {
                await fetch(`/api/decks/${currentDeckId}/cards/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cards })
                });
                
                document.getElementById('batchCardsInput').value = '';
                loadCards(currentDeckId);
                loadDecks();
                loadStats();
                alert(`成功导入 ${cards.length} 张卡片`);
            } catch (err) {
                console.error('Failed to save batch cards:', err);
                alert('批量导入失败');
            }
        }

        function editCard(id, question, answer) {
            document.getElementById('editCardId').value = id;
            document.getElementById('editCardQuestion').value = question;
            document.getElementById('editCardAnswer').value = answer;
            document.getElementById('editCardModal').classList.add('active');
        }

        async function updateCard() {
            const id = document.getElementById('editCardId').value;
            const question = document.getElementById('editCardQuestion').value.trim();
            const answer = document.getElementById('editCardAnswer').value.trim();
            
            if (!question || !answer) {
                alert('请输入问题和答案');
                return;
            }

            try {
                await fetch(`/api/cards/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, answer })
                });
                
                closeModal('editCardModal');
                loadCards(currentDeckId);
            } catch (err) {
                console.error('Failed to update card:', err);
                alert('更新失败');
            }
        }

        async function deleteCard(id) {
            if (!confirm('确定要删除这张卡片吗？')) return;
            
            try {
                await fetch(`/api/cards/${id}`, { method: 'DELETE' });
                loadCards(currentDeckId);
                loadDecks();
                loadStats();
            } catch (err) {
                console.error('Failed to delete card:', err);
                alert('删除失败');
            }
        }

        function selectReviewMode(mode) {
            currentReviewMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.mode === mode);
            });
            document.getElementById('clozeOptions').classList.toggle('hidden', mode !== 'cloze');
        }

        async function startReview(deckId) {
            try {
                const res = await fetch(`/api/decks/${deckId}/review`);
                reviewCards = await res.json();
                
                if (reviewCards.length === 0) {
                    alert('该知识库没有卡片');
                    return;
                }
                
                currentCardIndex = 0;
                document.getElementById('totalReview').textContent = reviewCards.length;
                document.getElementById('reviewView').classList.add('hidden');
                document.getElementById('reviewGameView').classList.remove('hidden');
                
                showCurrentCard();
            } catch (err) {
                console.error('Failed to start review:', err);
                alert('加载失败');
            }
        }

        function showCurrentCard() {
            if (currentCardIndex >= reviewCards.length) {
                alert('恭喜你已完成所有卡片的复习！');
                exitReview();
                return;
            }

            const card = reviewCards[currentCardIndex];
            document.getElementById('currentIndex').textContent = currentCardIndex + 1;
            document.getElementById('reviewQuestion').textContent = card.question;
            document.getElementById('reviewAnswer').textContent = card.answer;
            
            const clozeText = generateCloze(card.answer);
            document.getElementById('reviewCloze').textContent = clozeText;
            
            document.getElementById('reviewAnswer').classList.remove('show');
            document.getElementById('reviewCloze').classList.remove('show');
            document.getElementById('showAnswerBtn').classList.remove('hidden');
            document.getElementById('masteryBtns').classList.add('hidden');
            
            isAnswerShown = false;
        }

        function generateCloze(answer) {
            const difficulty = document.querySelector('input[name="clozeDifficulty"]:checked').value;
            const percent = parseInt(difficulty) / 100;
            
            const words = answer.split(/([\s,，.。!！?？])/);
            const totalWords = words.filter(w => w.trim().length > 0).length;
            const hideCount = Math.max(1, Math.round(totalWords * percent));
            
            const nonEmptyIndices = words.map((w, i) => w.trim() ? i : -1).filter(i => i >= 0);
            const shuffled = nonEmptyIndices.sort(() => Math.random() - 0.5);
            const toHide = new Set(shuffled.slice(0, hideCount));
            
            return words.map((word, i) => {
                if (toHide.has(i) && word.trim()) {
                    return '______';
                }
                return word;
            }).join('');
        }

        function showAnswer() {
            isAnswerShown = true;
            
            if (currentReviewMode === 'moshi') {
                document.getElementById('reviewAnswer').classList.add('show');
            } else {
                document.getElementById('reviewCloze').classList.add('show');
            }
            
            document.getElementById('showAnswerBtn').classList.add('hidden');
            document.getElementById('masteryBtns').classList.remove('hidden');
        }

        async function rateMastery(level) {
            const card = reviewCards[currentCardIndex];
            
            try {
                await fetch(`/api/cards/${card.id}/mastery`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mastery_level: level })
                });
                
                currentCardIndex++;
                showCurrentCard();
                loadStats();
            } catch (err) {
                console.error('Failed to rate mastery:', err);
            }
        }

        function exitReview() {
            document.getElementById('reviewGameView').classList.add('hidden');
            document.getElementById('reviewView').classList.remove('hidden');
            reviewCards = [];
            currentCardIndex = 0;
            loadReviewDecks();
            loadStats();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (modalId === 'deckModal') {
                delete document.getElementById('deckModal').dataset.editId;
            }
        }

        document.getElementById('deckModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeModal('deckModal');
            }
        });

        document.getElementById('cardsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeModal('cardsModal');
            }
        });

        document.getElementById('editCardModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeModal('editCardModal');
            }
        });

        loadDecks();
        loadStats();
    </script>
</body>
</html>
